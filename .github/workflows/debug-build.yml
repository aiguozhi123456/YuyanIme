name: Debug Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate debug keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/yuyan-release.jks \
            -storepass android -keypass android \
            -alias yuyan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=CN"
          cat > keystore/keystore.properties <<EOF
          storeFile=keystore/yuyan-release.jks
          storePassword=android
          keyAlias=yuyan
          keyPassword=android
          EOF

      - name: Build debug APK
        run: ./gradlew :app:assembleOfflineDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-debug-apk
          path: app/build/outputs/apk/offline/debug/*.apk
          retention-days: 14
